version: 2.1
orbs:
    snyk: snyk/snyk@1.1.2
jobs:
    build-test-monitor:
        docker:
            - image: cimg/node:22.23
        steps:
            - checkout
            - run: npm install semantic-release@24.2.9 @semantic-release/exec@7.1.0 @yao-pkg/pkg@6.23.0 --save-dev --legacy-peer-deps
            - run: npm install
            - run: npm test
            - snyk/scan:
                fail-on-issues: true
                severity-threshold: critical
                monitor-on-build: true
                token-variable: SNYK_TOKEN
            - run:
                name: Install ldid (lets pkg ad-hoc sign the macOS binaries)
                command: |
                    LDID_VERSION=v2.1.5-procursus7
                    LDID_SHA256=4b8862b2fefa2cd7fa8f88cb0310779619aeaa8c72d6aff22f019b470f2fa99a
                    curl -fsSL -o /tmp/ldid "https://github.com/ProcursusTeam/ldid/releases/download/${LDID_VERSION}/ldid_linux_x86_64"
                    echo "${LDID_SHA256}  /tmp/ldid" | sha256sum -c -
                    sudo install -m 0755 /tmp/ldid /usr/local/bin/ldid
                    command -v ldid
            - run: npx semantic-release@24.2.9
    build-test:
        docker:
            - image: cimg/node:22.23
        steps:
            - checkout
            - run: npm install
            - run: npm test
            - snyk/scan:
                fail-on-issues: true
                monitor-on-build: false
                token-variable: SNYK_TOKEN
            - run: npx tsc
    build-test-from-fork:
        docker:
            - image: cimg/node:22.23
        steps:
            - checkout
            - run: npm install
            - run: npm test
            - run: npx tsc

workflows:
    version: 2.1
    build-test-monitor:
        jobs:
            - build-test-monitor:
                context: SNYK
                filters:
                    branches:
                        only:
                            - master
    build-test:
        jobs:
            - build-test:
                context: SNYK
                filters:
                    branches:
                        ignore:
                        - master
                        - /pull\/[0-9]+/
            - build-test-from-fork:
                filters:
                    branches:
                        only:
                        - /pull\/[0-9]+/
